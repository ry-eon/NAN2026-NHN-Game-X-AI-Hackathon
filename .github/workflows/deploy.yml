name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # 무료 플랜의 Pages는 public 리포 전용 — private인 동안은 스킵해서 커밋에
    # 실패(빨간 X)가 안 붙게 한다. public 전환 후 첫 push부터 자동 재개.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 버전은 package.json의 packageManager 필드에서 읽는다

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          # Pages는 /<repo>/ 하위 경로에서 서빙 — 리포 이름이 바뀌어도 따라가도록 동적 주입
          GHPAGES_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
        with:
          # 리포에서 Pages를 아직 켜지 않았어도 워크플로가 직접 활성화
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
